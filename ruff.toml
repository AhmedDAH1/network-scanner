target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "PIE", "S", "BLE", "PLW", "DTZ", "EXE"]
ignore = [
    "E501",
    # TEMPORARY: re-enable in Phase 2 when print() is replaced with logging
    "BLE001",
    "S110",
    "S112",
]

[lint.per-file-ignores]
# pytest checks results with plain `assert`. In application code S101 is a
# real bug (python -O deletes asserts), so it stays on everywhere else.
"tests/**" = ["S101"]
