target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "PIE", "S", "BLE", "PLW", "DTZ", "EXE"]
ignore = [
    "E501",
    # TEMPORARY: re-enable in Phase 2 when print() is replaced with logging
    "BLE001",
    "S110",
    "S112",
]

[lint.per-file-ignores]
# KNOWN VULNERABILITIES, fixed in Phase 1 Step 3 (web app hardening):
#   S603: query-string input reaches the scanner command unvalidated
#   S104: dashboard binds to all interfaces with no authentication
"web_app.py" = ["S603", "S104"]